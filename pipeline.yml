name: Recommendation pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths: ['src/**', 'dags/**', 'configs/**', 'requirements.txt', 'tests/**', '.github/workflows/pipeline.yml']
jobs:
  pipeline:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: python dags/workflow.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence
          path: |
            reports/
            experiments/
